<section class="space-y-6">
  <header class="flex items-start justify-between gap-4">
    <div class="space-y-1">
      <p class="text-sm text-slate-500">Supervisor</p>
      <h1 class="text-2xl font-semibold text-[var(--fg)]">Production</h1>
    </div>
    <div class="flex gap-2 items-center">
      <button
        type="button"
        class="px-4 py-2 rounded-lg border border-[var(--border)] hover:bg-[var(--surface)] transition text-sm"
        (click)="openAddPart()"
      >
        + Add New Part
      </button>
      <button
        type="button"
        class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 transition text-sm"
        (click)="goToNewOrder()"
      >
        + Add New Order
      </button>
    </div>
  </header>

  <!-- Tab Bar -->
  <div class="flex gap-1 border-b border-[var(--border)]">
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium border-b-2 transition -mb-px"
        [class.border-green-600]="selectedTab() === tab.id"
        [class.text-green-600]="selectedTab() === tab.id"
        [class.border-transparent]="selectedTab() !== tab.id"
        [class.text-slate-500]="selectedTab() !== tab.id"
        (click)="selectTab(tab.id)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <!-- ORDERS TAB -->
  @if (selectedTab() === 'orders') {
    <app-production-orders-tab />
  }

  <!-- JOBS TAB -->
  @if (selectedTab() === 'jobs') {
    <app-production-jobs-tab (assignLot)="openAssignLotModal($event)" />
  }

  <!-- PARTS TAB -->
  @if (selectedTab() === 'parts') {
    <app-production-parts-tab />
  }

  <!-- SHIFTS TAB -->
  @if (selectedTab() === 'shifts') {
    <app-production-shifts-tab />
  }
</section>

@if (isAddPartOpen()) {
  <app-add-part-modal
    (closed)="isAddPartOpen.set(false)"
    (created)="onPartCreated()"
  />
}

@if (selectedJobForLot()) {
  <app-assign-stock-lot-modal
    [job]="selectedJobForLot()!"
    (closed)="selectedJobForLot.set(null)"
    (updated)="onLotAssigned()"
  />
}
