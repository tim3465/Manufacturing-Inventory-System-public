<section class="space-y-6">
  <header class="space-y-1">
    <p class="text-sm text-slate-500">Supervisor</p>
    <h1 class="text-2xl font-semibold text-[var(--fg)]">New Order</h1>
  </header>

  @if (successOrderId()) {
    <div class="rounded-xl border border-green-300 bg-green-50 p-6 space-y-4">
      <p class="text-green-700 font-semibold">Order #{{ successOrderId() }} was created successfully.</p>
      <div class="flex gap-3">
        <button
          type="button"
          class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 transition text-sm"
          (click)="goToProduction()"
        >
          View Production
        </button>
        <button
          type="button"
          class="px-4 py-2 rounded-lg border border-[var(--border)] hover:bg-[var(--surface)] transition text-sm"
          (click)="resetForm()"
        >
          Create Another Order
        </button>
      </div>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Order Info -->
      <div class="rounded-xl border border-[var(--border)] bg-[var(--surface)] p-5 space-y-4">
        <h2 class="text-base font-semibold text-[var(--fg)]">Order Details</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="block">
            <div class="text-sm font-medium text-[var(--fg)]">Customer</div>
            <select
              class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
              formControlName="customerId"
            >
              <option [value]="0" disabled>Select a customer</option>
              @for (customer of customers(); track customer.id) {
                <option [value]="customer.id">{{ customer.companyName }}</option>
              }
            </select>
            @if (form.controls.customerId.touched && form.controls.customerId.invalid) {
              <div class="mt-1 text-xs text-red-500">Customer is required</div>
            }
          </label>

          <label class="block">
            <div class="text-sm font-medium text-[var(--fg)]">Part</div>
            <select
              class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
              formControlName="partId"
            >
              <option [value]="0" disabled>Select a part</option>
              @for (part of parts(); track part.id) {
                <option [value]="part.id">{{ part.partName }} ({{ part.partNumber }})</option>
              }
            </select>
            @if (form.controls.partId.touched && form.controls.partId.invalid) {
              <div class="mt-1 text-xs text-red-500">Part is required</div>
            }
          </label>

          <label class="block">
            <div class="text-sm font-medium text-[var(--fg)]">Parts Requested</div>
            <input
              type="number"
              min="1"
              class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
              formControlName="partAmountRequested"
            />
            @if (form.controls.partAmountRequested.touched && form.controls.partAmountRequested.invalid) {
              <div class="mt-1 text-xs text-red-500">Parts requested must be at least 1</div>
            }
          </label>

          <label class="block">
            <div class="text-sm font-medium text-[var(--fg)]">Parts Per Bar</div>
            <input
              type="number"
              min="1"
              class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
              formControlName="partsPerBar"
            />
            @if (form.controls.partsPerBar.touched && form.controls.partsPerBar.invalid) {
              <div class="mt-1 text-xs text-red-500">Parts per bar must be at least 1</div>
            }
          </label>
        </div>
      </div>

      <!-- Jobs -->
      <div class="rounded-xl border border-[var(--border)] bg-[var(--surface)] p-5 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold text-[var(--fg)]">Jobs</h2>
          <button
            type="button"
            class="px-3 py-1.5 rounded-lg border border-[var(--border)] hover:bg-[var(--surface)] transition text-sm"
            (click)="addJob()"
          >
            + Add Job
          </button>
        </div>

        <div formArrayName="jobs" class="space-y-4">
          @for (job of jobsArray.controls; track $index) {
            <div
              [formGroupName]="$index"
              class="rounded-lg border border-[var(--border)] p-4 space-y-3"
            >
              <div class="flex items-center justify-between">
                <span class="text-sm font-semibold text-[var(--fg)]">Job {{ $index + 1 }}</span>
                @if (jobsArray.length > 1) {
                  <button
                    type="button"
                    class="text-xs text-red-600 hover:underline"
                    (click)="removeJob($index)"
                  >
                    Remove
                  </button>
                }
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <label class="block">
                  <div class="text-xs font-medium text-[var(--fg)]">Stock Lot ID</div>
                  <input
                    type="number"
                    min="1"
                    class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
                    formControlName="stockLotId"
                  />
                  @if (getControl(job, 'stockLotId')?.touched && getControl(job, 'stockLotId')?.invalid) {
                    <div class="mt-1 text-xs text-red-500">Required</div>
                  }
                </label>

                <label class="block">
                  <div class="text-xs font-medium text-[var(--fg)]">Machine ID</div>
                  <input
                    type="number"
                    min="1"
                    class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
                    formControlName="machineId"
                  />
                  @if (getControl(job, 'machineId')?.touched && getControl(job, 'machineId')?.invalid) {
                    <div class="mt-1 text-xs text-red-500">Required</div>
                  }
                </label>

                <label class="block">
                  <div class="text-xs font-medium text-[var(--fg)]">Part Amount Planned</div>
                  <input
                    type="number"
                    min="0"
                    class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
                    formControlName="partAmountPlanned"
                  />
                  @if (getControl(job, 'partAmountPlanned')?.touched && getControl(job, 'partAmountPlanned')?.invalid) {
                    <div class="mt-1 text-xs text-red-500">Required, min 0</div>
                  }
                </label>

                <label class="block">
                  <div class="text-xs font-medium text-[var(--fg)]">Bar Amount Planned</div>
                  <input
                    type="number"
                    min="0"
                    class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
                    formControlName="barAmountPlanned"
                  />
                  @if (getControl(job, 'barAmountPlanned')?.touched && getControl(job, 'barAmountPlanned')?.invalid) {
                    <div class="mt-1 text-xs text-red-500">Required, min 0</div>
                  }
                </label>

                <label class="block">
                  <div class="text-xs font-medium text-[var(--fg)]">Bar Cycle Time (HH:MM:SS)</div>
                  <input
                    type="text"
                    placeholder="00:05:00"
                    class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
                    formControlName="barCycleTime"
                    autocomplete="off"
                  />
                  @if (getControl(job, 'barCycleTime')?.touched && getControl(job, 'barCycleTime')?.invalid) {
                    <div class="mt-1 text-xs text-red-500">Required, format HH:MM:SS</div>
                  }
                </label>

                <label class="block">
                  <div class="text-xs font-medium text-[var(--fg)]">Bars In Job</div>
                  <input
                    type="number"
                    min="0"
                    class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
                    formControlName="barsInJob"
                  />
                  @if (getControl(job, 'barsInJob')?.touched && getControl(job, 'barsInJob')?.invalid) {
                    <div class="mt-1 text-xs text-red-500">Required, min 0</div>
                  }
                </label>

                <label class="block">
                  <div class="text-xs font-medium text-[var(--fg)]">Estimated Parts Per Bar <span class="text-slate-400">(optional)</span></div>
                  <input
                    type="number"
                    min="0"
                    class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
                    formControlName="estimatedPartsPerBar"
                  />
                </label>

                <label class="block">
                  <div class="text-xs font-medium text-[var(--fg)]">Due Date</div>
                  <input
                    type="date"
                    class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
                    formControlName="dueDate"
                  />
                  @if (getControl(job, 'dueDate')?.touched && getControl(job, 'dueDate')?.invalid) {
                    <div class="mt-1 text-xs text-red-500">Due date is required</div>
                  }
                </label>
              </div>
            </div>
          }
        </div>
      </div>

      <!-- Submit -->
      <div class="flex justify-end">
        <button
          type="submit"
          class="px-6 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 transition text-sm disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="submitting()"
        >
          {{ submitting() ? 'Creating...' : 'Create Order' }}
        </button>
      </div>

    </form>
  }
</section>
