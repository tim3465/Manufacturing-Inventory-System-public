<section class="space-y-6">
  <header class="space-y-1">
    <p class="text-sm text-slate-500">Machinist</p>
    <h1 class="text-2xl font-semibold text-[var(--fg)]">Log Shift</h1>
  </header>

  <div class="rounded-xl border border-[var(--border)] bg-[var(--surface)] p-4 space-y-4">
    <div>
      <p class="text-sm text-slate-500">Current machine</p>
      <p class="text-lg font-semibold text-[var(--fg)]">HAAS VF-2</p>
    </div>

    <div class="grid sm:grid-cols-3 gap-3">
      <div
        *ngFor="let task of tasks"
        class="rounded-lg border border-[var(--border)] bg-[var(--bg)] p-3"
      >
        <p class="text-sm text-slate-500">{{ task.label }}</p>
        <p class="text-xl font-semibold text-[var(--fg)]">{{ task.value }}</p>
      </div>
    </div>

    <button
      type="button"
      class="inline-flex items-center justify-center px-4 py-2 rounded-lg border border-[var(--border)] bg-[var(--bg)] text-sm font-medium hover:bg-[var(--surface)] transition"
    >
      Save draft entry
    </button>
  </div>
</section>
