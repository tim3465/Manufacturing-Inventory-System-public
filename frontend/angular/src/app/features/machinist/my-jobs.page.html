<section class="space-y-6">
  <header class="space-y-1">
    <p class="text-sm text-slate-500">Machinist</p>
    <h1 class="text-2xl font-semibold text-[var(--fg)]">My Jobs</h1>
  </header>

  <div class="rounded-xl border border-[var(--border)] bg-[var(--surface)]">
    <div class="px-4 py-3 border-b border-[var(--border)] flex justify-between">
      <span class="text-sm font-medium">Queue</span>
      <button
        type="button"
        class="text-sm text-slate-500 hover:text-[var(--fg)] underline underline-offset-4"
      >
        Refresh
      </button>
    </div>
    <ul class="divide-y divide-[var(--border)]">
      @for (job of jobs; track job.id) {
      <li class="px-4 py-3 flex items-center justify-between text-sm">
        <div>
          <p class="font-semibold text-[var(--fg)]">{{ job.id }}</p>
          <p class="text-slate-500">{{ job.part }}</p>
        </div>
        <span class="text-xs px-2 py-1 rounded-full border border-[var(--border)]">
          {{ job.status }}
        </span>
      </li>
      }
    </ul>
  </div>
</section>
