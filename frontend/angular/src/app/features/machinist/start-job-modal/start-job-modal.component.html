<div class="fixed inset-0 z-50 flex items-center justify-center px-4">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/50 z-0 pointer-events-none"></div>

  <!-- Modal -->
  <div
    class="relative z-10 w-full max-w-lg rounded-xl border border-[var(--border)] bg-[var(--bg)] shadow-xl"
  >
    <div
      class="relative w-full max-w-lg rounded-xl border border-[var(--border)] bg-[var(--bg)] shadow-xl"
    >
      <div class="px-5 py-4 border-b border-[var(--border)] flex items-center justify-between">
        <div>
          <div class="text-lg font-semibold text-[var(--fg)]">Start job</div>
        </div>
        <button
          type="button"
          class="h-9 w-9 rounded-lg border border-[var(--border)] hover:bg-[var(--surface)] transition"
          (click)="onCancel()"
          [disabled]="submitting()"
          aria-label="Close"
        >
          ✕
        </button>
      </div>

      <form class="p-5 space-y-4" [formGroup]="form" (ngSubmit)="onSubmit()">
        <label class="block">
          <div class="text-sm font-medium text-[var(--fg)]">Bars to pull</div>
          <input
            type="number"
            class="mt-1 w-full rounded-lg border border-[var(--border)] bg-[var(--bg)] px-3 py-2 text-sm"
            formControlName="barsToAdd"
            autocomplete="off"
          />
          @if (form.controls.barsToAdd.touched && form.controls.barsToAdd.invalid) {
            <div class="mt-1 text-xs text-red-500">Bars to pull must be at least 1</div>
          }
        </label>

        <div class="pt-2 flex items-center justify-end gap-3">
          <button
            type="button"
            class="px-4 py-2 rounded-lg border border-[var(--border)] hover:bg-[var(--surface)] transition text-sm"
            (click)="onCancel()"
            [disabled]="submitting()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 transition text-sm disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="submitting()"
          >
            Start job
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
