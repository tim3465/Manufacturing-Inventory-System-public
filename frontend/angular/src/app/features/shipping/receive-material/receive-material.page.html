<section class="space-y-6">
  <header class="space-y-1">
    <p class="text-sm text-slate-500">Shipping / Receiving</p>
    <h1 class="text-2xl font-semibold text-[var(--fg)]">Receive Material</h1>
  </header>

  <div class="rounded-xl border border-[var(--border)] bg-[var(--surface)]">
    <div class="px-4 py-3 border-b border-[var(--border)] text-sm font-medium">
      Incoming deliveries
    </div>
    <ul class="divide-y divide-[var(--border)]">
      @for (receipt of receipts; track receipt.id) {
      <li class="px-4 py-3 flex items-center justify-between text-sm">
        <div>
          <p class="font-semibold text-[var(--fg)]">{{ receipt.id }}</p>
          <p class="text-slate-500">{{ receipt.supplier }}</p>
        </div>
        <span class="px-2 py-1 rounded-full border border-[var(--border)] text-xs">
          {{ receipt.status }}
        </span>
      </li>
      }
    </ul>
  </div>
</section>
