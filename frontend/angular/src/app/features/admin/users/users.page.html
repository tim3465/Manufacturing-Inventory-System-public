<section class="space-y-6">
  <header class="flex items-start justify-between gap-4">
    <div class="space-y-1">
      <p class="text-sm text-slate-500">Admin</p>
      <h1 class="text-2xl font-semibold text-[var(--fg)]">Users</h1>
    </div>

    <div class="flex items-center gap-4">
      <button
        type="button"
        class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition text-sm"
        (click)="openAddUser()"
      >
        Add user
      </button>

      @if (canShowAllToggle()) {
        <label class="inline-flex items-center gap-3 select-none">
          <span class="text-sm text-slate-500">All users</span>
          <span class="relative inline-flex">
            <input
              type="checkbox"
              class="sr-only"
              [checked]="showAll()"
              (change)="onToggleAllUsers($event)"
            />
            <span
              class="relative inline-flex h-6 w-11 items-center rounded-full border border-[var(--border)] transition-colors"
              [ngClass]="showAll() ? 'bg-blue-600' : 'bg-[var(--surface)]'"
              aria-hidden="true"
            >
              <span
                class="inline-block h-5 w-5 transform rounded-full bg-[var(--bg)] transition-transform"
                [ngClass]="showAll() ? 'translate-x-5' : 'translate-x-1'"
              ></span>
            </span>
          </span>
        </label>
      }
    </div>
  </header>

  <div class="rounded-xl border border-[var(--border)] bg-[var(--surface)]">
    <div class="px-4 py-3 border-b border-[var(--border)] text-sm font-medium">
      Team members
    </div>
    @if (loading()) {
      <div class="px-4 py-3 text-sm text-slate-500">Loading...</div>
    } @else if (error()) {
      <div class="px-4 py-3 text-sm text-red-500">{{ error() }}</div>
    } @else {
      <ul class="divide-y divide-[var(--border)]">
        @for (user of userRows(); track user.id) {
          <li class="px-4 py-3 flex items-center justify-between text-sm">
            <div>
              <p class="font-semibold text-[var(--fg)]">{{ user.name }}</p>
              <p class="text-slate-500">{{ user.userName }}</p>
            </div>
            <span class="text-xs px-2 py-1 rounded-full border border-[var(--border)]">
              {{ user.status }}
            </span>
          </li>
        }
      </ul>
    }
  </div>

  @if (isAddUserOpen()) {
    <app-add-user-modal
      (closed)="closeAddUser()"
      (created)="loadUsers()"
    />
  }
</section>
