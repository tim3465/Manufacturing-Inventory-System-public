<div class="fixed inset-0 z-50 flex items-center justify-center px-4">
  <div class="absolute inset-0 bg-black/50 z-0 pointer-events-none"></div>

  <div
    class="relative z-10 w-full max-w-lg rounded-xl border border-[var(--border)] bg-[var(--bg)] shadow-xl"
  >
    <div
      class="relative w-full max-w-lg rounded-xl border border-[var(--border)] bg-[var(--bg)] shadow-xl"
    >
      <div class="px-5 py-4 border-b border-[var(--border)] flex items-center justify-between">
        <div>
          <div class="text-lg font-semibold text-[var(--fg)]">Inactivate machine</div>
        </div>
        <button
          type="button"
          class="h-9 w-9 rounded-lg border border-[var(--border)] hover:bg-[var(--surface)] transition"
          (click)="onCancel()"
          [disabled]="submitting()"
          aria-label="Close"
        >
          ✕
        </button>
      </div>

      <div class="p-5 space-y-4">
        <p class="text-sm text-[var(--fg)]">
          Are you sure you want to inactivate this machine?
        </p>

        <div class="rounded-lg border border-[var(--border)] p-3 bg-[var(--surface)]">
          <p class="text-sm font-semibold text-[var(--fg)]">{{ serialNumber }}</p>
          <p class="text-sm text-slate-500">{{ modelNumber }}</p>
        </div>

        <div class="pt-2 flex items-center justify-end gap-3">
          <button
            type="button"
            class="px-4 py-2 rounded-lg border border-[var(--border)] hover:bg-[var(--surface)] transition text-sm"
            (click)="onCancel()"
            [disabled]="submitting()"
          >
            Cancel
          </button>
          <button
            type="button"
            class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 transition text-sm disabled:opacity-50 disabled:cursor-not-allowed"
            (click)="onConfirm()"
            [disabled]="submitting()"
          >
            Yes, inactivate
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
