<nav class="h-full flex flex-col gap-4 px-4 py-6 text-sm">
  <div class="flex items-center gap-3">
    <div
      class="h-10 w-10 rounded-lg bg-[var(--border)] text-[var(--fg)] flex items-center justify-center font-semibold text-sm tracking-wide"
    >
      CNC
    </div>
    <div>
      <p class="text-sm text-slate-500">Console</p>
      <p class="text-lg font-semibold leading-tight">CNC App</p>
    </div>
  </div>

  <div class="space-y-1">
    @for (link of topLinks; track link.path) {
    <a
      [routerLink]="link.path"
      routerLinkActive="active"
      class="flex items-center justify-between rounded-lg px-3 py-2 text-[var(--fg)] border border-transparent hover:border-[var(--border)] hover:bg-[var(--surface)] transition-colors"
    >
      <span>{{ link.label }}</span>
      <span class="text-xs text-slate-400">›</span>
    </a>
    }
  </div>

  <div class="space-y-3 pt-2">
    @for (group of groups; track group.role) {
    <div class="space-y-1">
      <button
        type="button"
        (click)="toggle(group.role)"
        class="w-full flex items-center justify-between rounded-lg px-3 py-2 text-[var(--fg)] border border-transparent hover:border-[var(--border)] hover:bg-[var(--surface)] transition-colors text-left"
      >
        <span class="font-semibold">{{ roleLabels[group.role] }}</span>
        <span
          class="text-xs text-slate-400 transition-transform"
          [class.rotate-90]="isExpanded()(group.role)"
        >
          ›
        </span>
      </button>
      @if (isExpanded()(group.role)) {

      <div class="ml-2 border-l border-[var(--border)] pl-3 space-y-1">
        @for (item of group.items; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="flex items-center justify-between rounded-lg px-3 py-2 text-[var(--fg)] border border-transparent hover:border-[var(--border)] hover:bg-[var(--surface)] transition-colors"
        >
          <span>{{ item.label }}</span>
          <span class="text-xs text-slate-400">›</span>
        </a>
        }
      </div>
      }
    </div>
    }
  </div>
</nav>
