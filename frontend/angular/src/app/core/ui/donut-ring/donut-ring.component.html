<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 36 36"
>
  <!-- Background ring (remaining) -->
  <circle
    cx="18" cy="18" r="15.9155"
    fill="none"
    stroke="var(--border)"
    stroke-width="3"
  />

  <!-- Good arc -->
  @if (goodPercent() > 0) {
    <circle
      cx="18" cy="18" r="15.9155"
      fill="none"
      stroke="var(--success)"
      stroke-width="3"
      stroke-linecap="butt"
      [attr.stroke-dasharray]="goodPercent() + ' ' + (100 - goodPercent())"
      stroke-dashoffset="0"
      transform="rotate(-90 18 18)"
    />
  }

  <!-- Scrap arc -->
  @if (scrapPercent() > 0) {
    <circle
      cx="18" cy="18" r="15.9155"
      fill="none"
      stroke="var(--danger)"
      stroke-width="3"
      stroke-linecap="butt"
      [attr.stroke-dasharray]="scrapPercent() + ' ' + (100 - scrapPercent())"
      [attr.stroke-dashoffset]="scrapOffset()"
      transform="rotate(-90 18 18)"
    />
  }

  <!-- Center text: main label -->
  <text
    x="18" y="17"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="var(--fg)"
    font-size="4.5"
    font-weight="600"
  >
    {{ centerLabel() }}
  </text>

  <!-- Center text: scrap (secondary) -->
  @if (scrapLabel()) {
    <text
      x="18" y="21.5"
      text-anchor="middle"
      dominant-baseline="middle"
      fill="var(--danger)"
      font-size="3"
      font-weight="500"
    >
      {{ scrapLabel() }}
    </text>
  }

  <!-- Overflow indicator -->
  @if (isOverflow()) {
    <text
      x="18" y="25.5"
      text-anchor="middle"
      dominant-baseline="middle"
      fill="var(--danger)"
      font-size="3"
      font-weight="600"
    >
      {{ overflowLabel() }}
    </text>
  }
</svg>
