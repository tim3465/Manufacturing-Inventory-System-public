<div class="flex items-center justify-between px-4 py-3 border border-[var(--border)] bg-[var(--surface)] text-sm">
  <button
    type="button"
    class="px-3 py-1.5 rounded-lg border border-[var(--border)] hover:bg-[var(--bg)] transition disabled:opacity-40 disabled:cursor-not-allowed"
    [disabled]="currentPage <= 1"
    (click)="prev()"
  >
    Previous
  </button>

  <span class="text-slate-500">
    Page {{ currentPage }} of {{ totalPages }} ({{ totalCount }} total)
  </span>

  <div class="flex items-center gap-3">
    <button
      type="button"
      class="px-3 py-1.5 rounded-lg border border-[var(--border)] hover:bg-[var(--bg)] transition disabled:opacity-40 disabled:cursor-not-allowed"
      [disabled]="currentPage >= totalPages"
      (click)="next()"
    >
      Next
    </button>

    @if (pageSizes && pageSizes.length > 0) {
      <select
        [value]="pageSize"
        (change)="onPageSizeChange($event)"
        class="rounded-lg border border-[var(--border)] bg-[var(--surface)] px-2 py-1.5 text-sm text-[var(--fg)] cursor-pointer"
      >
        @for (size of pageSizes; track size) {
          <option [value]="size">{{ size }} per page</option>
        }
      </select>
    }
  </div>
</div>
