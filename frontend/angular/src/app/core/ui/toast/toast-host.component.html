<div
  class="toast-host"
  aria-live="polite"
  aria-relevant="additions removals"
>
  <div
    *ngFor="let toast of toasts(); trackBy: trackById"
    class="toast-item"
    [ngClass]="[typeClasses(toast), animationClasses(toast)]"
    role="status"
    (click)="dismiss(toast.id)"
  >
    <div class="flex items-start gap-3">
      <div class="min-w-0 flex-1">
        <div class="text-sm font-medium text-white">
          {{ label(toast) }}
        </div>
        <div class="mt-0.5 text-sm text-white/90 break-words">
          {{ toast.message }}
        </div>
      </div>
      <button
        type="button"
        class="shrink-0 rounded p-1 text-slate-500 hover:text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400/40"
        aria-label="Close toast"
        (click)="dismiss(toast.id)"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  </div>
</div>
